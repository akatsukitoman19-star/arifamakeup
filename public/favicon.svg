<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6BE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9F7A2B"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D0A10"/>
      <stop offset="100%" stop-color="#0B090A"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Elegant Serif Lettermark 'A' -->
  <text x="32" y="44" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="600" fill="url(#goldGrad)" text-anchor="middle">A</text>
  <!-- Crown/Sparkle Accent -->
  <circle cx="32" cy="13" r="2" fill="#F3E5AB"/>
</svg>
